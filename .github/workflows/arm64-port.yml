# SPDX-License-Identifier: GPL-2.0-or-later
# ARM64 Android Port Package CI (nixport.port.v1)
# Builds native ARM64 shadPS4 + FEXCore guest CPU runtime inside Debian Trixie,
# bundles Clean UI v1.0.0 Launcher + 5,993-line Bakka Sub Indonesian Patch into a Type-2
# ARM64 AppImage, and publishes KamenRiderMoH.nixport.<version>.zip + .sha256.

name: ARM64 port package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_runtime:
        description: Build native ARM64 shadPS4 + FEXCore runtime (disable for fast launcher-only test)
        required: false
        default: true
        type: boolean
      tag:
        description: Optional release tag to create or update (e.g. v1.0.0-alpha.1); leave empty for artifact only
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: arm64-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Python scripts and JSON contracts
        run: |
          python3 -m py_compile \
            scripts/android_config.py \
            scripts/indo_patcher.py \
            scripts/save_manager.py \
            scripts/sfo_parser.py \
            scripts/trophy_manager.py \
            launcher/kr_android_launcher.py \
            packaging/arm-linux/entry_main.py \
            packaging/arm-linux/fetch-sysroot.py
          python3 -m json.tool packaging/arm-linux/port.json >/dev/null
          python3 -m json.tool packaging/arm-linux/virtualkeys.json >/dev/null
          python3 -m json.tool runtime/runtime-lock.json >/dev/null
          python3 -m json.tool patches/id_patch.json >/dev/null

      - name: Install host packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends squashfs-tools curl git python3 binutils

      - name: Fetch nixport host packaging tools (if published)
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          set -euxo pipefail
          dest="$GITHUB_WORKSPACE/fexdroid"
          rm -rf "$dest"
          mkdir -p "$dest"
          curl -fsSL --retry 3 --retry-delay 5 https://codeload.github.com/zFitness/nixport/tar.gz/refs/heads/main \
            | tar xz -C "$dest" --strip-components=1 || true
          chmod +x "$dest"/scripts/*.sh 2>/dev/null || true

      - name: Build native ARM64 shadPS4 + FEXCore runtime (Debian Trixie)
        if: ${{ github.event_name == 'push' || inputs.build_runtime != false }}
        run: bash packaging/arm-linux/build-runtime.sh

      - name: Assemble Type-2 ARM64 AppImage & strict nixport.port.v1 archive
        env:
          KR_HOST_TOOLS: ${{ github.workspace }}/fexdroid
          KR_BUILD_RUNTIME: '0'
        run: bash packaging/arm-linux/build.sh

      - name: Name release archive & compute SHA-256
        id: package
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          base_version=$(python3 -c "import json; print(json.load(open('packaging/arm-linux/port.json'))['version'])")
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -n "$tag" ]; then
            ver="${tag#v}"
          else
            ver="${base_version}"
          fi
          mkdir -p dist
          pkg_name="KamenRiderMoH.nixport.${ver}.zip"
          cp packaging/arm-linux/dist/kamen-rider-moh-port.zip "dist/${pkg_name}"
          (cd dist && sha256sum "${pkg_name}" > "${pkg_name}.sha256")
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "pkg_name=${pkg_name}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KamenRiderMoH-nixport-${{ steps.package.outputs.version }}
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 30

      - name: Publish Release / Pre-release assets (on tag push or manual tag input)
        if: steps.package.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.package.outputs.release_tag }}
          PKG_NAME: ${{ steps.package.outputs.pkg_name }}
        run: |
          tag="$TAG_NAME"
          prerelease_flag=""
          case "$tag" in
            *-alpha*|*-beta*|*-rc*|*-test*)
              prerelease_flag="--prerelease"
              ;;
          esac
          notes=$(cat <<EOF
          ## Kamen Rider: Memory of Heroes (Android ARM64 Port, ${tag})

          ARM64 Android \`nixport.port.v1\` package by **AO Zero** & **Bakka Sub**.

          ### Included in \`${PKG_NAME}\`
          - Native ARM64 \`shadPS4\` Vulkan 1.3 + \`FEXCore\` guest x86-64 CPU runtime (\`bin/kr_core\`)
          - Clean UI v1.0.0 Launcher (Dark & Light Mode, English & Bahasa Indonesia)
          - Built-in Indonesian Subtitle Patch (5,993 strings by Bakka Sub) with automatic vanilla backup
          - Landscape Touch Virtual Gamepad layout (\`virtualkeys.json\`)

          ### Quick Testing Steps
          1. Install \`nixport\` APK (with Mesa Turnip driver on Snapdragon Adreno 6xx/7xx/8xx, 8+ GB RAM).
          2. Import \`${PKG_NAME}\` via **nixport -> Library -> Import Port package**.
          3. Point the launcher to your legal \`CUSA17374\` game dump folder containing \`eboot.bin\`.
          4. Start with \`540p\` or \`720p\`, test the 1-click Indonesian Patch, and share \`home/kr_moh/logs/launch.log\` + \`home/kr_moh/bin/user/log/shad_log.txt\` if you hit any issue.
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip dist/*.sha256 --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$tag" dist/*.zip dist/*.sha256 \
              $prerelease_flag \
              --title "Kamen Rider: Memory of Heroes Android Port ${tag}" \
              --notes "$notes"
          fi
